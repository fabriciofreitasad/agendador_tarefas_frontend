<mat-card class="meus-dados-card">
  <mat-card-header class="meus-dados-header">
    <mat-card-title class="meus-dados-titulo"> Meus dados</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="form">
      <mat-form-field class="full-width">
        <mat-label>nome</mat-label>
        <input matInput formControlName="nome">
      </mat-form-field>
      <mat-form-field class="full-width">
        <mat-label>email</mat-label>
        <input matInput formControlName="email">
      </mat-form-field>
    </form>

    <h3>Endereço</h3>
    <button mat-flat-button (click)="cadastrarEndereco()">Adicione endereço</button>

    <h3>Telefone</h3>
    <button mat-flat-button (click)="cadastrarTelefone()">Adicione telefone</button>

  </mat-card-content>
</mat-card>
